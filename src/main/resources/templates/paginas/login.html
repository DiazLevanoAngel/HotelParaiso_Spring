<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hotelero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/Login.css}">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-6 PanelIzquierdo">
            <div class="Celda">
                <h1>Sistema Hotelero</h1>
                <p>Gestiona habitaciones, reservas, clientes y pagos desde un <br>
                    solo panel. Inicia sesión con tus credenciales de personal.</p>
            </div>
        </div>

        <div class="col-md-6 PanelDerecho">
            <h3>Iniciar sesion</h3>
            <!-- TODO: th:action="@{/login}" method="post" cuando exista autenticación real -->
            <form>
                <div class="mb-3">
                    <label>Usuario</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Contraseña</label>
                    <input type="password" class="form-control">
                </div>

                <a th:href="@{/home}" class="btn btn-primary w-100 mt-2">Iniciar sesión</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>

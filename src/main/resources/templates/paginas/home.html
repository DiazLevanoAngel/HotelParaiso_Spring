<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio — Hotel Paraíso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/StyleHome.css}">
</head>
<body>
<div class="d-flex vh-100">
    <aside th:replace="~{fragmentos/sidebar :: sidebar}"></aside>

    <div class="d-flex flex-column flex-grow-1">
        <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

        <div class="container">
            <main>
                <h1>Inicio</h1>
                <p class="text-secondary">Resumen general de la operación del hotel</p>

                <section class="d-flex gap-3 mb-4">
                    <div class="estadistica-card">
                        <h2 class="text-primary" th:text="${habitacionesDisponibles}">0</h2>
                        <p>Habitaciones disponibles</p>
                    </div>
                    <div class="estadistica-card">
                        <h2 class="text-primary" th:text="${reservasActivas}">0</h2>
                        <p>Reservas activas</p>
                    </div>
                    <div class="estadistica-card">
                        <h2 class="text-primary" th:text="'S/. ' + ${#numbers.formatDecimal(ingresos, 1, 2)}">S/. 0.00</h2>
                        <p>Ingresos registrados</p>
                    </div>
                    <div class="estadistica-card">
                        <h2 class="text-primary" th:text="${totalClientes}">0</h2>
                        <p>Clientes registrados</p>
                    </div>
                </section>

                <section class="tabla-reservas">
                    <h3>Últimas reservas</h3>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Habitación</th>
                            <th>Fechas</th>
                            <th>Estado</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${reservas}">
                            <td th:text="${r.cliente}"></td>
                            <td th:text="${r.habitacion}"></td>
                            <td th:text="${r.checkIn} + ' → ' + ${r.checkOut}"></td>
                            <td>
                                <span th:if="${r.estado == 'Cancelada'}" class="text-danger">Cancelada</span>
                                <span th:if="${r.estado == 'Confirmada'}" class="text-success">Pagada</span>
                                <span th:if="${r.estado == 'Pendiente'}" class="text-warning">Pendiente de pago</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reservas)}">
                            <td colspan="4" class="text-center text-secondary">No hay reservas registradas todavía.</td>
                        </tr>
                        </tbody>
                    </table>
                </section>
            </main>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>

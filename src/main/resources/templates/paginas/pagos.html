<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos — Hotel Paraíso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/pagos.css}">
</head>
<body>
<div class="d-flex vh-100">
    <aside th:replace="~{fragmentos/sidebar :: sidebar}"></aside>

    <div class="d-flex flex-column flex-grow-1">
        <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

        <div class="container">
            <main>
                <h1>Pagos</h1>
                <p class="text-secondary"
                   th:text="${#lists.size(pagos)} + ' pagos registrados'">0 pagos registrados</p>

                <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#modalPago">
                    + Registrar pago
                </button>

                <section class="tabla-reservas">
                    <h3>Historial de pagos</h3>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Habitación</th>
                            <th>Monto</th>
                            <th>Método</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${pagos}">
                            <td th:text="${p.fecha}"></td>
                            <td th:text="${p.cliente}"></td>
                            <td th:text="${p.habitacion}"></td>
                            <td th:text="'S/. ' + ${#numbers.formatDecimal(p.monto, 1, 2)}"></td>
                            <td th:text="${p.metodoPago}"></td>
                            <td class="text-nowrap">
                                <!-- Los pagos no se editan, solo se eliminan -->
                                <form th:action="@{/pagos/eliminar/{id}(id=${p.id})}" method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('¿Eliminar este pago?');">
                                    <button class="btn btn-danger btn-sm" type="submit">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pagos)}">
                            <td colspan="6" class="text-center text-secondary">
                                No hay pagos registrados todavía.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </section>

                <!-- Modal: Registrar pago -->
                <div class="modal fade" id="modalPago" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header bg-primary text-white">
                                <h5 class="modal-title">Registrar pago</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">

                                <div th:if="${#lists.isEmpty(reservasPendientes)}" class="alert alert-info">
                                    No hay reservas pendientes de pago.
                                </div>

                                <form th:action="@{/pagos/guardar}" th:object="${pago}" method="post" id="formPago">

                                    <label class="text-primary">Cliente</label>
                                    <select class="form-select mb-2" th:field="*{reservaId}" id="selReserva">
                                        <option value="0">— Selecciona un cliente —</option>
                                        <option th:each="r : ${reservasPendientes}"
                                                th:value="${r.id}"
                                                th:data-habitacion="${r.habitacion}"
                                                th:data-monto="${r.monto}"
                                                th:text="${r.cliente} + ' — Hab. ' + ${r.habitacion} + ' — S/. ' + ${#numbers.formatDecimal(r.monto, 1, 2)}">
                                        </option>
                                    </select>

                                    <label class="text-primary">Habitación</label>
                                    <input class="form-control mb-2" type="text" id="txtHabitacion" readonly>

                                    <label class="text-primary">Monto a pagar (S/.)</label>
                                    <input class="form-control mb-2" type="text" id="txtMonto" readonly>

                                    <label class="text-primary">Método de pago</label>
                                    <select class="form-select mb-2" th:field="*{metodoPago}">
                                        <option value="Efectivo">Efectivo</option>
                                        <option value="Tarjeta">Tarjeta</option>
                                        <option value="Transferencia">Transferencia</option>
                                        <option value="Yape/Plin">Yape/Plin</option>
                                    </select>

                                    <label class="text-primary">Fecha</label>
                                    <input class="form-control mb-3" type="date" name="fecha"
                                           th:value="${pago.fecha}" required>

                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                        <button type="submit" class="btn btn-primary">Procesar pago</button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
<script>
    // Al elegir el cliente se muestran la habitación y el monto de su reserva.
    // Los datos reales los toma el servidor de la reserva al guardar.
    var selReserva = document.getElementById('selReserva');
    selReserva.addEventListener('change', function () {
        var opcion = selReserva.options[selReserva.selectedIndex];
        var habitacion = opcion.getAttribute('data-habitacion');
        var monto = parseFloat(opcion.getAttribute('data-monto'));

        if (habitacion === null || isNaN(monto)) {
            document.getElementById('txtHabitacion').value = '';
            document.getElementById('txtMonto').value = '';
        } else {
            document.getElementById('txtHabitacion').value = habitacion;
            document.getElementById('txtMonto').value = monto.toFixed(2);
        }
    });
</script>
</body>
</html>

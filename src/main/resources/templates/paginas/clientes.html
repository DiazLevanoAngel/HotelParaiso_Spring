<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes — Hotel Paraíso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
</head>
<body>
<div class="d-flex vh-100">
    <aside th:replace="~{fragmentos/sidebar :: sidebar}"></aside>

    <div class="d-flex flex-column flex-grow-1">
        <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

        <div class="container">
            <main>
                <h1>Clientes</h1>
                <p class="text-secondary"
                   th:text="${#lists.size(clientes)} + ' clientes registrados'">0 clientes registrados</p>

                <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#modalCliente">
                    + Registrar cliente
                </button>

                <section class="tabla-reservas">
                    <h3>Lista de clientes</h3>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Documento</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${clientes}">
                            <td th:text="${c.nombre}"></td>
                            <td th:text="${c.documento}"></td>
                            <td th:text="${c.telefono}"></td>
                            <td th:text="${c.correo}"></td>
                            <td class="text-nowrap">
                                <button class="btn btn-warning" type="button"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#modalEditar' + ${c.id}">Editar</button>
                                <form th:action="@{/clientes/eliminar/{id}(id=${c.id})}" method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('¿Eliminar este cliente?');">
                                    <button class="btn btn-danger" type="submit">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="5" class="text-center text-secondary">
                                No hay clientes registrados todavía.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </section>

                <!-- Modal: Registrar cliente -->
                <div class="modal fade" id="modalCliente" tabindex="-1">
                    <div class="modal-dialog">
                        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" class="modal-content">
                            <div class="modal-header bg-primary text-white">
                                <h5 class="modal-title">Registrar cliente</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" th:field="*{id}">

                                <label class="text-primary" for="nombre">Nombre completo</label>
                                <input class="form-control mb-2" id="nombre" type="text"
                                       th:field="*{nombre}" required>

                                <label class="text-primary" for="documento">Documento (DNI/CE)</label>
                                <input class="form-control mb-2" id="documento" type="text"
                                       th:field="*{documento}" required>

                                <label class="text-primary" for="telefono">Teléfono</label>
                                <input class="form-control mb-2" id="telefono" type="text"
                                       th:field="*{telefono}">

                                <label class="text-primary" for="correo">Correo</label>
                                <input class="form-control mb-2" id="correo" type="email"
                                       th:field="*{correo}">
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Modales: Editar cliente (uno por cada registro) -->
                <div class="modal fade" th:each="c : ${clientes}" th:id="'modalEditar' + ${c.id}" tabindex="-1">
                    <div class="modal-dialog">
                        <form th:action="@{/clientes/guardar}" method="post" class="modal-content">
                            <div class="modal-header bg-primary text-white">
                                <h5 class="modal-title">Editar cliente</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" name="id" th:value="${c.id}">

                                <label class="text-primary" th:for="'nombre' + ${c.id}">Nombre completo</label>
                                <input class="form-control mb-2" type="text"
                                       th:id="'nombre' + ${c.id}" name="nombre" th:value="${c.nombre}" required>

                                <label class="text-primary" th:for="'documento' + ${c.id}">Documento (DNI/CE)</label>
                                <input class="form-control mb-2" type="text"
                                       th:id="'documento' + ${c.id}" name="documento" th:value="${c.documento}" required>

                                <label class="text-primary" th:for="'telefono' + ${c.id}">Teléfono</label>
                                <input class="form-control mb-2" type="text"
                                       th:id="'telefono' + ${c.id}" name="telefono" th:value="${c.telefono}">

                                <label class="text-primary" th:for="'correo' + ${c.id}">Correo</label>
                                <input class="form-control mb-2" type="email"
                                       th:id="'correo' + ${c.id}" name="correo" th:value="${c.correo}">
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                            </div>
                        </form>
                    </div>
                </div>

            </main>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
</body>
</html>

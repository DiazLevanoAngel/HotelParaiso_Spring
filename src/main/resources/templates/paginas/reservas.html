<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas — Hotel Paraíso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/reservas.css}">
</head>
<body>
<div class="d-flex vh-100">
    <aside th:replace="~{fragmentos/sidebar :: sidebar}"></aside>

    <div class="d-flex flex-column flex-grow-1">
        <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

        <div class="container">
            <main>
                <h1>Reservas</h1>
                <p class="text-secondary"
                   th:text="${#lists.size(reservas)} + ' reservas registradas'">0 reservas registradas</p>

                <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#modalReserva">
                    + Registrar reserva
                </button>

                <section class="tabla-reservas">
                    <h3>Lista de reservas</h3>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Habitación</th>
                            <th>Check-in</th>
                            <th>Check-out</th>
                            <th>Huéspedes</th>
                            <th>Monto total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${reservas}">
                            <td th:text="${r.cliente}"></td>
                            <td th:text="${r.habitacion}"></td>
                            <td th:text="${r.checkIn}"></td>
                            <td th:text="${r.checkOut}"></td>
                            <td th:text="${r.huespedes}"></td>
                            <td th:text="'S/. ' + ${#numbers.formatDecimal(r.monto, 1, 2)}"></td>
                            <td>
                                <span th:if="${r.estado == 'Cancelada'}" class="text-danger" th:text="${r.estado}"></span>
                                <span th:if="${r.estado == 'Confirmada'}" class="text-success">Pagada</span>
                                <span th:if="${r.estado == 'Pendiente'}" class="text-warning">Pendiente de pago</span>
                            </td>
                            <td class="text-nowrap">
                                <!-- Solo se pueden editar las reservas que aún no se pagaron -->
                                <button class="btn btn-warning btn-sm" type="button"
                                        th:if="${r.estado == 'Pendiente'}"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#modalEditar' + ${r.id}">Editar</button>
                                <form th:action="@{/reservas/eliminar/{id}(id=${r.id})}" method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('¿Eliminar esta reserva?');">
                                    <button class="btn btn-danger btn-sm" type="submit">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reservas)}">
                            <td colspan="8" class="text-center text-secondary">
                                No hay reservas registradas todavía.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </section>

                <!-- Modal: Registrar reserva -->
                <div class="modal fade" id="modalReserva" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header bg-primary text-white">
                                <h5 class="modal-title">Registrar reserva</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form th:action="@{/reservas/guardar}" th:object="${reserva}" method="post"
                                      class="form-reserva">
                                    <input type="hidden" th:field="*{id}">

                                    <label class="text-primary">Cliente</label>
                                    <select class="form-select mb-2" th:field="*{cliente}" required>
                                        <option value="">— Selecciona un cliente —</option>
                                        <option th:each="c : ${clientes}"
                                                th:value="${c.nombre}"
                                                th:text="${c.nombre}">
                                        </option>
                                    </select>

                                    <label class="text-primary">Habitación</label>
                                    <select class="form-select mb-2 sel-habitacion" th:field="*{habitacion}" required>
                                        <option value="">— Selecciona una habitación —</option>
                                        <option th:each="h : ${habitaciones}"
                                                th:if="${h.estado == 'Disponible'}"
                                                th:value="${h.numero}"
                                                th:data-precio="${h.precio}"
                                                th:text="'Hab. ' + ${h.numero} + ' — S/. ' + ${#numbers.formatDecimal(h.precio, 1, 2)} + ' por noche'">
                                        </option>
                                    </select>

                                    <label class="text-primary">Check-in</label>
                                    <input class="form-control mb-2 fecha-entrada" type="date" th:field="*{checkIn}" required>

                                    <label class="text-primary">Check-out</label>
                                    <input class="form-control mb-2 fecha-salida" type="date" th:field="*{checkOut}" required>

                                    <label class="text-primary">Huéspedes</label>
                                    <input class="form-control mb-2" type="number" min="1" th:field="*{huespedes}" required>

                                    <label class="text-primary">Monto total</label>
                                    <input class="form-control mb-3 monto-total" type="text" readonly
                                           placeholder="Se calcula según las noches">

                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                        <button type="submit" class="btn btn-primary">Guardar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modales: Editar reserva (uno por cada reserva pendiente de pago) -->
                <div class="modal fade" th:each="r : ${reservas}" th:if="${r.estado == 'Pendiente'}"
                     th:id="'modalEditar' + ${r.id}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header bg-warning">
                                <h5 class="modal-title">Editar reserva</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <form th:action="@{/reservas/guardar}" method="post" class="form-reserva">
                                <div class="modal-body">
                                    <input type="hidden" name="id" th:value="${r.id}">

                                    <label class="text-primary">Cliente</label>
                                    <select class="form-select mb-2" name="cliente" required>
                                        <option value="">— Selecciona un cliente —</option>
                                        <option th:each="c : ${clientes}"
                                                th:value="${c.nombre}"
                                                th:text="${c.nombre}"
                                                th:selected="${c.nombre == r.cliente}">
                                        </option>
                                    </select>

                                    <label class="text-primary">Habitación</label>
                                    <select class="form-select mb-2 sel-habitacion" name="habitacion" required>
                                        <option value="">— Selecciona una habitación —</option>
                                        <option th:each="h : ${habitaciones}"
                                                th:if="${h.estado == 'Disponible' or h.numero == r.habitacion}"
                                                th:value="${h.numero}"
                                                th:data-precio="${h.precio}"
                                                th:selected="${h.numero == r.habitacion}"
                                                th:text="'Hab. ' + ${h.numero} + ' — S/. ' + ${#numbers.formatDecimal(h.precio, 1, 2)} + ' por noche'">
                                        </option>
                                    </select>

                                    <label class="text-primary">Check-in</label>
                                    <input class="form-control mb-2 fecha-entrada" type="date" name="checkIn"
                                           th:value="${r.checkIn}" required>

                                    <label class="text-primary">Check-out</label>
                                    <input class="form-control mb-2 fecha-salida" type="date" name="checkOut"
                                           th:value="${r.checkOut}" required>

                                    <label class="text-primary">Huéspedes</label>
                                    <input class="form-control mb-2" type="number" min="1" name="huespedes"
                                           th:value="${r.huespedes}" required>

                                    <label class="text-primary">Monto total</label>
                                    <input class="form-control mb-2 monto-total" type="text" readonly
                                           placeholder="Se calcula según las noches">
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
<script>
    // Muestra el monto total (precio por noche x noches) en cada formulario de reserva.
    // El monto real lo vuelve a calcular el servidor al guardar.
    function calcularMonto(form) {
        var select = form.querySelector('.sel-habitacion');
        var entrada = form.querySelector('.fecha-entrada').value;
        var salida = form.querySelector('.fecha-salida').value;
        var campo = form.querySelector('.monto-total');

        var opcion = select.options[select.selectedIndex];
        var precio = parseFloat(opcion.getAttribute('data-precio'));

        if (entrada === '' || salida === '' || isNaN(precio)) {
            campo.value = '';
            return;
        }

        var noches = Math.round((new Date(salida) - new Date(entrada)) / 86400000);
        if (noches <= 0) {
            campo.value = 'La salida debe ser posterior a la entrada';
            return;
        }

        campo.value = 'S/. ' + (precio * noches).toFixed(2) + ' (' + noches + ' noche(s))';
    }

    var formularios = document.querySelectorAll('.form-reserva');
    for (var i = 0; i < formularios.length; i++) {
        var form = formularios[i];
        form.addEventListener('change', function () {
            calcularMonto(this);
        });
        calcularMonto(form);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Hotel Paraíso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/contacto.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body>
<div class="d-flex vh-100">
    <aside th:replace="~{fragmentos/sidebar :: sidebar}"></aside>

    <div class="d-flex flex-column flex-grow-1">
        <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

        <div class="container">
            <main>
                <div class="contacto text-center mb-5 p-4">
                    <h3 class="text-primary mb-2">Contáctanos</h3>
                    <p class="text-muted mb-4">Déjanos tu mensaje y te responderemos pronto.</p>

                    <form class="contacto-form">
                        <label for="nombre" class="form-label mt-3">Nombre</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Tu nombre" required>

                        <label for="correo" class="form-label mt-3">Correo electrónico</label>
                        <input type="email" id="correo" class="form-control" placeholder="tu@email.com" required>

                        <label for="mensaje" class="form-label mt-3">Mensaje</label>
                        <textarea id="mensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje" required></textarea>

                        <button type="submit" class="btn btn-primary mt-3">Enviar mensaje</button>
                    </form>
                </div>

                <div class="ubicacion text-center m-1 p-4">
                    <h2 class="text-primary mb-2">Ubícanos</h2>
                    <p class="text-muted mb-3">Encuéntranos en nuestra ubicación:</p>
                    <iframe
                            src="https://www.google.com/maps?q=Lima%2C%20Per%C3%BA&output=embed"
                            title="Ubicación del Hotel Paraíso">
                    </iframe>
                </div>
            </main>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
</body>
</html>
